name: decode-screenshots
on:
  push:
    paths:
      - "*.b64"
      - ".github/workflows/decode-screenshots.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG screenshots
        run: |
          set -euo pipefail
          for f in *.b64; do
            [ -f "$f" ] || continue
            base64 -d "$f" > "${f%.b64}"
            file "${f%.b64}"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          if git diff --cached --quiet; then
            echo "no png changes"
            exit 0
          fi
          git commit -m "chore: decode REC-1493 PR screenshots"
          git push
