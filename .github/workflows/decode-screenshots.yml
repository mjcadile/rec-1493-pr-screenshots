name: Decode screenshots

on:
  push:
    paths:
      - "COMMIT_PNGS"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 screenshots and commit PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          decoded=0
          for f in *.b64; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            python3 - "$out" <<'PY'
import os, sys
p = sys.argv[1]
with open(p, "rb") as fh:
    magic = fh.read(8)
if magic != b"\x89PNG\r\n\x1a\n":
    raise SystemExit(f"{p} is not a PNG: {magic!r}")
print(p, "ok", os.path.getsize(p))
PY
            git add "$out"
            decoded=$((decoded + 1))
          done
          if [ "$decoded" -eq 0 ]; then
            echo "no .b64 files"
            exit 1
          fi
          git rm -f COMMIT_PNGS *.b64 || true
          git commit -m "chore: commit decoded PR screenshots"
          git push
